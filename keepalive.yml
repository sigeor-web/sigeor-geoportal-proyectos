name: Supabase keepalive

on:
  schedule:
    - cron: '0 8 */5 * *'   # cada 5 días a las 8am UTC
  workflow_dispatch:          # también se puede ejecutar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: psql "${{ secrets.SUPABASE_DB_URL }}" -c "SELECT 1;"
